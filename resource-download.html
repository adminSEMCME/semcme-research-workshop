<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Download resource | SEMCME Research Workshop</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="panel">
        <h1>Download resource</h1>
        <p id="downloadStatus" role="status" aria-live="polite">Preparing your file...</p>
        <p><a id="saveFile" class="primary-button" hidden>Save file</a></p>
        <button id="retryDownload" class="secondary-button" type="button" hidden>Try again</button>
        <p><a href="/">Return to the workshop</a></p>
      </section>
    </main>
    <script src="/resource-download.js" type="module"></script>
  </body>
</html>
